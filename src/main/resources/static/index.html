<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduCore School Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #1f2937;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           Sidebar
        ========================= */

        .sidebar {
            width: 240px;
            background-color: #111827;
            color: white;
            padding: 25px 18px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .logo span {
            color: #3b82f6;
        }

        .nav-link {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            color: #cbd5e1;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .nav-link:hover {
            background-color: #1f2937;
            color: white;
        }

        .nav-link.active {
            background-color: #2563eb;
            color: white;
        }

        /* =========================
           Main
        ========================= */

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .topbar p {
            color: #6b7280;
            margin-top: 5px;
        }

        .add-top-button {
            border: none;
            background-color: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-top-button:hover {
            background-color: #1d4ed8;
        }

        /* =========================
           Stats
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .stat-title {
            color: #6b7280;
            font-size: 14px;
        }

        .stat-number {
            font-size: 34px;
            font-weight: bold;
            margin-top: 10px;
        }

        .blue {
            border-left: 5px solid #2563eb;
        }

        .green {
            border-left: 5px solid #16a34a;
        }

        .purple {
            border-left: 5px solid #7c3aed;
        }

        /* =========================
           Card
        ========================= */

        .card {
            background-color: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-header h2 {
            font-size: 20px;
        }

        /* =========================
           Search
        ========================= */

        .search-box {
            width: 300px;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
        }

        .search-box:focus {
            border-color: #2563eb;
        }

        /* =========================
           Table
        ========================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px;
            background-color: #f9fafb;
            color: #6b7280;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-top: 1px solid #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active-status {
            background-color: #dcfce7;
            color: #15803d;
        }

        .inactive-status {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        /* =========================
           Buttons
        ========================= */

        .action-button {
            border: none;
            padding: 7px 11px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
        }

        /* =========================
           Modal
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(17, 24, 39, 0.65);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            width: 420px;
            max-width: 90%;
            padding: 25px;
            border-radius: 16px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .save-button {
            border: none;
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .cancel-button {
            border: none;
            background-color: #e5e7eb;
            color: #111827;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           Message
        ========================= */

        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 80px;
            }

            .logo {
                font-size: 18px;
                padding-left: 0;
            }

            .nav-link {
                font-size: 0;
                text-align: center;
            }

            .nav-link::first-letter {
                font-size: 18px;
            }

            .main {
                margin-left: 80px;
                width: calc(100% - 80px);
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-box {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            Edu<span>Core</span>
        </div>

        <button class="nav-link active" onclick="showDashboard()">
            🏠 Dashboard
        </button>

        <button class="nav-link" onclick="loadSchools()">
            🏫 Schools
        </button>

        <button class="nav-link" onclick="openAddModal()">
            ➕ Add School
        </button>

    </aside>


    <!-- Main Content -->
    <main class="main">

        <div class="topbar">

            <div>
                <h1>School Management Dashboard</h1>
                <p>Manage all school records from one place.</p>
            </div>

            <button class="add-top-button" onclick="openAddModal()">
                + Add New School
            </button>

        </div>


        <!-- Statistics -->
        <div class="stats">

            <div class="stat-card blue">

                <div class="stat-title">
                    Total Schools
                </div>

                <div class="stat-number" id="totalSchools">
                    0
                </div>

            </div>


            <div class="stat-card green">

                <div class="stat-title">
                    Active Schools
                </div>

                <div class="stat-number" id="activeSchools">
                    0
                </div>

            </div>


            <div class="stat-card purple">

                <div class="stat-title">
                    Locations
                </div>

                <div class="stat-number" id="totalLocations">
                    0
                </div>

            </div>

        </div>


        <!-- School Table -->
        <div class="card">

            <div class="card-header">

                <h2>School Directory</h2>

                <input
                        type="text"
                        class="search-box"
                        id="tableSearch"
                        placeholder="Search by name or location..."
                        onkeyup="filterSchools()">

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>School Name</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Created Date</th>
                        <th>Actions</th>
                    </tr>

                    </thead>

                    <tbody id="schoolTableBody">

                    <tr>
                        <td colspan="6">
                            Loading schools...
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<!-- Add School Modal -->
<div class="modal" id="addModal">

    <div class="modal-content">

        <h2>Add New School</h2>

        <input
                type="text"
                id="addSchoolName"
                placeholder="School Name">

        <input
                type="text"
                id="addLocation"
                placeholder="Location">

        <div id="addMessage"></div>

        <div class="modal-actions">

            <button
                    class="cancel-button"
                    onclick="closeAddModal()">
                Cancel
            </button>

            <button
                    class="save-button"
                    onclick="addSchool()">
                Save School
            </button>

        </div>

    </div>

</div>


<!-- Update School Modal -->
<div class="modal" id="updateModal">

    <div class="modal-content">

        <h2>Update School</h2>

        <input
                type="number"
                id="updateId"
                placeholder="School ID"
                readonly>

        <input
                type="text"
                id="updateName"
                placeholder="School Name">

        <input
                type="text"
                id="updateLocation"
                placeholder="Location">

        <div id="updateMessage"></div>

        <div class="modal-actions">

            <button
                    class="cancel-button"
                    onclick="closeUpdateModal()">
                Cancel
            </button>

            <button
                    class="save-button"
                    onclick="updateSchool()">
                Update School
            </button>

        </div>

    </div>

</div>


<script>

    // SchoolController:
    // @RequestMapping("School")
    const baseUrl = "/School";

    let allSchools = [];


    // =============================================
    // Load all Schools.
    // @GetMapping("getAll")
    // =============================================

    async function loadSchools() {

        try {

            const response =
                await fetch(`${baseUrl}/getAll`);

            if (!response.ok) {
                throw new Error("Could not load schools");
            }

            allSchools =
                await response.json();

            displaySchools(allSchools);

            updateStatistics();

        } catch (error) {

            document.getElementById("schoolTableBody").innerHTML = `

                <tr>
                    <td colspan="6">
                        Error loading schools.
                    </td>
                </tr>

            `;

        }

    }


    // =============================================
    // Display Schools inside Table.
    // SchoolDTO fields:
    // schoolId
    // schoolName
    // schoolLocation
    // =============================================

    function displaySchools(schools) {

        const tableBody =
            document.getElementById("schoolTableBody");

        tableBody.innerHTML = "";


        if (schools.length === 0) {

            tableBody.innerHTML = `

                <tr>
                    <td colspan="6">
                        No schools found.
                    </td>
                </tr>

            `;

            return;
        }


        schools.forEach(school => {

            tableBody.innerHTML += `

                <tr>

                    <td>
                        ${school.schoolId}
                    </td>

                    <td>
                        <strong>
                            ${school.schoolName}
                        </strong>
                    </td>

                    <td>
                        ${school.schoolLocation}
                    </td>

                    <td>

                        <span class="status active-status">
                            Active
                        </span>

                    </td>

                    <td>
                        -
                    </td>

                    <td>

                        <button
                                class="action-button edit-button"
                                onclick="openUpdateModal(
                                    ${school.schoolId},
                                    '${escapeQuotes(school.schoolName)}',
                                    '${escapeQuotes(school.schoolLocation)}'
                                )">

                            Edit

                        </button>

                        <button
                                class="action-button delete-button"
                                onclick="deleteSchool(${school.schoolId})">

                            Delete

                        </button>

                    </td>

                </tr>

            `;

        });

    }


    // =============================================
    // Add School.
    // @PostMapping("add")
    // =============================================

    async function addSchool() {

        const schoolName =
            document.getElementById("addSchoolName").value.trim();

        const location =
            document.getElementById("addLocation").value.trim();


        if (schoolName === "" || location === "") {

            document.getElementById("addMessage").innerHTML =
                '<div class="message">Please enter school name and location.</div>';

            return;
        }


        try {

            const response = await fetch(

                `${baseUrl}/add?schoolName=${encodeURIComponent(schoolName)}&location=${encodeURIComponent(location)}`,

                {
                    method: "POST"
                }

            );


            if (!response.ok) {
                throw new Error("Could not add school");
            }


            const id =
                await response.text();


            document.getElementById("addMessage").innerHTML =
                `<div class="message">
                    School created successfully. ID: ${id}
                </div>`;


            document.getElementById("addSchoolName").value = "";
            document.getElementById("addLocation").value = "";


            await loadSchools();


            setTimeout(function () {
                closeAddModal();
            }, 700);


        } catch (error) {

            document.getElementById("addMessage").innerHTML =
                '<div class="message">Error adding school.</div>';

        }

    }


    // =============================================
    // Update School.
    // @PutMapping("update")
    // =============================================

    async function updateSchool() {

        const id =
            document.getElementById("updateId").value;

        const name =
            document.getElementById("updateName").value.trim();

        const location =
            document.getElementById("updateLocation").value.trim();


        if (name === "" || location === "") {

            document.getElementById("updateMessage").innerHTML =
                '<div class="message">Please complete all fields.</div>';

            return;
        }


        try {

            const response = await fetch(

                `${baseUrl}/update?id=${id}&name=${encodeURIComponent(name)}&location=${encodeURIComponent(location)}`,

                {
                    method: "PUT"
                }

            );


            if (!response.ok) {
                throw new Error("Could not update school");
            }


            const school =
                await response.json();


            if (school.schoolId == null) {

                document.getElementById("updateMessage").innerHTML =
                    '<div class="message">School not found.</div>';

                return;
            }


            document.getElementById("updateMessage").innerHTML =
                '<div class="message">School updated successfully.</div>';


            await loadSchools();


            setTimeout(function () {
                closeUpdateModal();
            }, 700);


        } catch (error) {

            document.getElementById("updateMessage").innerHTML =
                '<div class="message">Error updating school.</div>';

        }

    }


    // =============================================
    // Delete School.
    // @DeleteMapping("Delete")
    // =============================================

    async function deleteSchool(id) {

        const confirmed =
            confirm("Are you sure you want to delete this school?");


        if (!confirmed) {
            return;
        }


        try {

            const response = await fetch(

                `${baseUrl}/Delete?id=${id}`,

                {
                    method: "DELETE"
                }

            );


            if (!response.ok) {
                throw new Error("Could not delete school");
            }


            const result =
                await response.json();


            if (result === true) {

                alert("School deleted successfully.");

                await loadSchools();

            } else {

                alert("School could not be deleted.");

            }

        } catch (error) {

            alert("Error deleting school.");

        }

    }


    // =============================================
    // Search inside loaded Schools.
    // =============================================

    function filterSchools() {

        const searchValue =
            document.getElementById("tableSearch")
                .value
                .toLowerCase();


        const filteredSchools =
            allSchools.filter(school => {

                const name =
                    school.schoolName == null
                        ? ""
                        : school.schoolName.toLowerCase();

                const location =
                    school.schoolLocation == null
                        ? ""
                        : school.schoolLocation.toLowerCase();


                return name.includes(searchValue)
                    || location.includes(searchValue);

            });


        displaySchools(filteredSchools);

    }


    // =============================================
    // Dashboard statistics.
    // =============================================

    function updateStatistics() {

        document.getElementById("totalSchools").innerText =
            allSchools.length;


        // SchoolDTO does not currently contain isActive,
        // so all returned Schools are counted as Active.
        document.getElementById("activeSchools").innerText =
            allSchools.length;


        const locations =
            new Set();


        allSchools.forEach(school => {

            if (school.schoolLocation != null) {

                locations.add(
                    school.schoolLocation.toLowerCase()
                );

            }

        });


        document.getElementById("totalLocations").innerText =
            locations.size;

    }


    // =============================================
    // Add Modal.
    // =============================================

    function openAddModal() {

        document.getElementById("addModal").style.display =
            "flex";

        document.getElementById("addMessage").innerHTML =
            "";

    }


    function closeAddModal() {

        document.getElementById("addModal").style.display =
            "none";

    }


    // =============================================
    // Update Modal.
    // =============================================

    function openUpdateModal(id, name, location) {

        document.getElementById("updateId").value =
            id;

        document.getElementById("updateName").value =
            name;

        document.getElementById("updateLocation").value =
            location;

        document.getElementById("updateMessage").innerHTML =
            "";

        document.getElementById("updateModal").style.display =
            "flex";

    }


    function closeUpdateModal() {

        document.getElementById("updateModal").style.display =
            "none";

    }


    // =============================================
    // Helper functions.
    // =============================================

    function escapeQuotes(value) {

        if (value == null) {
            return "";
        }

        return value
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'");

    }


    function showDashboard() {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // Load schools automatically when page opens.
    loadSchools();

</script>

</body>

</html>
